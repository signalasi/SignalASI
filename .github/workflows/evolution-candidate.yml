name: Evolution candidate gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: evolution-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r apps/desktop/core/galaxyssi-link/backend/requirements-test.txt
      - name: Build Signal sidecar
        run: apps/android/gradlew.bat -p apps/desktop/core/galaxyssi-link/backend/signal_sidecar installDist --no-daemon
      - name: Compile backend
        run: python -m compileall -q apps/desktop/core/galaxyssi-link/backend
      - name: Run backend unit tests
        working-directory: apps/desktop
        run: python -m pytest -q core/galaxyssi-link/backend

  desktop-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Desktop dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: npm ci
      - name: Source checks
        working-directory: apps/desktop
        run: node scripts/check.js
      - name: Package candidate
        working-directory: apps/desktop
        run: node scripts/package-win.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/**/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653" \
            "ndk;29.0.13113456" \
            "cmake;3.22.1" \
            "cmake;3.31.6"
      - name: Android unit tests and debug APK
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            -Pgalaxyssi.requireEmbeddedRuntime=false \
            --no-daemon
